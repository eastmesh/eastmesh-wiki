[project]
site_name = "EastMesh Wiki"
site_url = "https://wiki.eastmesh.au"
site_description = "EastMesh operational and technical wiki"
docs_dir = "wiki"
site_dir = "site"
extra_css = ["stylesheets/theme-overrides.css"]

[project.theme]
variant = "modern"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
